name: CI

on:
  push:
    branches: [main, Latest, master]
  pull_request:
    branches: [main, Latest, master]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew test --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 7

      - name: Validate resources
        run: ./gradlew validateResources --no-daemon --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uncannyvoxel-build
          path: build/libs/*.jar
          retention-days: 7

  gametest:
    name: Fabric GameTest (mc-runtime-test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: uncannyvoxel-build
          path: build/libs

      - name: Run Fabric GameTest via mc-runtime-test
        uses: headlesshq/mc-runtime-test@4.5.1
        with:
          mc: '26.2'
          modloader: 'fabric'
          regex: '.*fabric.*'
          mc-runtime-test: 'fabric'
          java: '25'
          fabric-api: '0.155.2'
          fabric-gametest-api: '4.0.13'
          headlessmc-command: '/test runall'

  ci-verification-gate:
    name: CI Verification Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, gametest]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Check job statuses
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "CI verification gate FAILED: build-and-test job did not succeed"
            exit 1
          fi
          if [ "${{ needs.gametest.result }}" != "success" ]; then
            echo "CI verification gate FAILED: gametest job did not succeed"
            exit 1
          fi
          echo "CI verification gate PASSED: all tests, build, and GameTest succeeded"

  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for common issues
        run: |
          if grep -r "TODO\|FIXME" src/main --include="*.java" | grep -v test; then
            echo "WARNING: TODO/FIXME comments found in production code"
          fi
