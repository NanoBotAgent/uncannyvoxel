plugins {
    id 'fabric-loom' version '1.17.17'
    id 'java'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.register('validateResources') {
    group = 'verification'
    description = 'Validates that all resource files are present and well-formed'
    doLast {
        def fabricModJson = file('src/main/resources/fabric.mod.json')
        if (!fabricModJson.exists()) {
            throw new GradleException('fabric.mod.json not found!')
        }
        println 'Resources validated successfully'
    }
}
