plugins {
    id 'net.fabricmc.fabric-loom-no-remap' version '1.14.0-alpha.31'
    id 'java'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "uncannyvoxel" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    client {
        compileClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation sourceSets.main.output
}

test {
    useJUnitPlatform()
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_uncannyvoxel" }
    }
}

task validateResources {
    doLast {
        def jsonFiles = fileTree('src/main/resources').include('**/*.json')
        jsonFiles.each { file ->
            def content = file.text
            try {
                def json = new groovy.json.JsonSlurper().parseText(content)
                println "Validated: ${file.path}"
            } catch (Exception e) {
                throw new GradleException("Invalid JSON in ${file.path}: ${e.message}")
            }
        }
        println 'All JSON resources are valid'
    }
}
